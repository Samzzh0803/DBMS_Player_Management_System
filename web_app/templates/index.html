<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Player Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main>
    <h1>Football Player Management System</h1>
    <p>Live web preview: dashboard player summary.</p>
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Age</th><th>Team</th><th>Position</th><th>Goals</th><th>Assists</th>
        </tr>
      </thead>
      <tbody>
      {% for player in players %}
        <tr>
          <td>{{ player.name }}</td>
          <td>{{ player.age }}</td>
          <td>{{ player.team }}</td>
          <td>{{ player.position }}</td>
          <td>{{ player.goals }}</td>
          <td>{{ player.assists }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </main>
</body>
</html>
